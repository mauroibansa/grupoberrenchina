<title>Cartas Grupo Berrenchina</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Kaushan+Script&family=Montserrat:ital,wght@0,400;0,500;0,600;0,700;0,800;1,800&display=swap">
<style>
/* Layout: portada con dos puertas (una por restaurante) y carta de una columna para el móvil en mesa.
   Cada restaurante redefine los tokens: granate y piedra (Fuerte Santiago), verde de mar y bruma (Mar y Monte). */
:root{
  --bg:#f4f1ec; --surface:#fffdf9; --ink:#1d1d1b; --muted:#6a625c; --line:#e2dbd2;
  --accent:#6e1a17; --accent-ink:#fffdf9; --soft:#efe6dc; --gold:#a8782f;
  --logo-red:#e20613; --logo-yellow:#f8b133;
  --f-ui:"Montserrat", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-script:"Kaushan Script", "Brush Script MT", cursive;
  --f-num:"Montserrat", system-ui, sans-serif;
}
:root[data-local="fuerte"]{ --bg:#f5f1ee; --surface:#fffdfb; --line:#e6dad4; --accent:#6e1a17; --soft:#f1e3dd; --gold:#a8782f; --muted:#6f5b58 }
:root[data-local="mym"]{ --bg:#eef3f1; --surface:#fbfdfc; --line:#d3e0dc; --accent:#125a5c; --soft:#dceae6; --gold:#5f7a2e; --muted:#566a66 }
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --bg:#141211; --surface:#1d1a18; --ink:#f1ece6; --muted:#a99f97; --line:#34302c; --accent:#e6a25a; --accent-ink:#141211; --soft:#2a2420; --gold:#e0b46a; color-scheme:dark }
  :root:not([data-theme="light"])[data-local="fuerte"]{ --bg:#170d0c; --surface:#211413; --line:#3a2725; --accent:#e58a83; --soft:#2d1b19; --gold:#d9b27a; --muted:#b7a19c }
  :root:not([data-theme="light"])[data-local="mym"]{ --bg:#0c1615; --surface:#13201f; --line:#253634; --accent:#6fc3bd; --soft:#1a2c2a; --gold:#b5cc7a; --muted:#9db3ae }
}
:root[data-theme="dark"]{ --bg:#141211; --surface:#1d1a18; --ink:#f1ece6; --muted:#a99f97; --line:#34302c; --accent:#e6a25a; --accent-ink:#141211; --soft:#2a2420; --gold:#e0b46a; color-scheme:dark }
:root[data-theme="dark"][data-local="fuerte"]{ --bg:#170d0c; --surface:#211413; --line:#3a2725; --accent:#e58a83; --soft:#2d1b19; --gold:#d9b27a; --muted:#b7a19c }
:root[data-theme="dark"][data-local="mym"]{ --bg:#0c1615; --surface:#13201f; --line:#253634; --accent:#6fc3bd; --soft:#1a2c2a; --gold:#b5cc7a; --muted:#9db3ae }

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:400 16px/1.5 var(--f-ui);transition:background .25s}
.demo{background:var(--logo-yellow);color:#1d1d1b;font:600 12.5px/1.4 var(--f-ui);padding:7px 16px;text-align:center}
.wrap{max-width:640px;margin:0 auto;padding-inline:16px;padding-block:0 56px}
.disc{background:#fff;border-radius:50%;display:grid;place-items:center;box-shadow:0 1px 0 var(--line),0 8px 24px rgba(0,0,0,.08);flex:none}
.disc img{display:block;width:88%;height:auto}
button{font:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}

/* Portada */
[hidden]{display:none!important}
#home{padding-block:36px 24px;display:grid;gap:28px;justify-items:center;text-align:center}
#home .disc{width:132px;height:132px}
#home h1{margin:0;font:800 italic clamp(26px,7vw,34px)/1.1 var(--f-ui);text-wrap:balance}
#home h1 span{display:block;font:400 .62em var(--f-script);color:var(--muted);font-style:normal;margin-top:6px}
.doors{display:grid;gap:14px;width:100%}
.door{display:flex;align-items:center;gap:16px;text-align:left;width:100%;padding:16px;border-radius:18px;border:0;cursor:pointer;color:#fff;text-decoration:none}
.door .disc{width:76px;height:76px;box-shadow:none}
.door b{display:block;font:800 italic 22px/1.1 var(--f-ui)}
.door small{display:block;font:500 13px/1.4 var(--f-ui);opacity:.85;margin-top:4px}
.door .go{margin-left:auto;font:600 22px var(--f-ui);opacity:.8}
.door.fuerte{background:#6e1a17}
.door.mym{background:#125a5c}
.door:hover .go{transform:translateX(3px)}
.home-foot{color:var(--muted);font-size:13px}

/* Carta */
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:14px 0}
.back{background:none;border:0;color:var(--muted);font:600 13px var(--f-ui);cursor:pointer;padding:6px 0}
.lang{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.lang button{background:none;border:0;padding:5px 11px;font:600 12px var(--f-ui);color:var(--muted);cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.head{display:flex;gap:16px;align-items:center;padding-block:18px 14px}
.head .disc{width:92px;height:92px}
.head h1{margin:0;font:800 italic clamp(24px,6.5vw,30px)/1.1 var(--f-ui);text-wrap:balance}
.head .meta{color:var(--muted);font-size:13.5px;margin-top:6px;display:grid}
.actions{display:flex;flex-wrap:wrap;gap:8px}
.btn{display:inline-flex;align-items:center;padding:9px 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:600 13.5px var(--f-ui);text-decoration:none;cursor:pointer}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.phone{font:500 12.5px var(--f-num);color:var(--muted);user-select:all;margin-top:6px;display:block}

.today{margin-top:20px;background:var(--accent);color:var(--accent-ink);border-radius:20px;padding:20px 20px 18px;position:relative;overflow:hidden}
.today::after{content:"";position:absolute;right:-40px;top:-40px;width:150px;height:150px;border-radius:50%;border:14px solid var(--logo-yellow);opacity:.22}
.today .kicker{font:600 11px var(--f-ui);letter-spacing:.14em;text-transform:uppercase;opacity:.8}
.today h2{margin:2px 0 12px;font:800 italic 26px/1.1 var(--f-ui)}
.today h2 span{font:400 1.15em var(--f-script);font-style:normal}
.today .grp{display:grid;gap:2px;margin-bottom:10px}
.today .grp b{font:400 18px var(--f-script);opacity:.9}
.today .grp div{font-size:15px;font-weight:500}
.today .price{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;border-top:1px solid color-mix(in srgb,var(--accent-ink) 30%,transparent);padding-top:12px;margin-top:4px}
.today .price strong{font:800 28px var(--f-num);font-variant-numeric:tabular-nums}
.today .price span{font-size:13px;opacity:.85}

nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line);margin-inline:-16px;padding:10px 16px;margin-top:22px}
.tabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;padding:7px 13px;border-radius:999px;border:0;background:transparent;color:var(--muted);font:600 13.5px var(--f-ui);cursor:pointer;white-space:nowrap}
.tab.on{background:var(--soft);color:var(--ink)}
.filter{margin-top:16px;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
.filter summary{padding:12px 14px;cursor:pointer;font-weight:600;font-size:14px;display:flex;justify-content:space-between;gap:8px}
.filter summary span{color:var(--muted);font-weight:400;font-size:13px}
.algs{display:flex;flex-wrap:wrap;gap:6px;padding:0 14px 14px}
.alg{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:999px;padding:4px 10px 4px 5px;font:500 13px var(--f-ui);cursor:pointer}
.alg[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.code{display:inline-grid;place-items:center;min-width:22px;height:22px;border-radius:999px;background:var(--soft);color:var(--ink);font:700 9.5px var(--f-ui);padding:0 5px}
.alg[aria-pressed="true"] .code{background:var(--bg)}
main section{padding-top:26px;scroll-margin-top:70px}
main h2{font:400 30px/1.1 var(--f-script);color:var(--accent);margin:0 0 2px}
.dish{display:grid;grid-template-columns:1fr auto;gap:3px 16px;padding:13px 0;border-bottom:1px solid var(--line)}
.dish:last-child{border-bottom:0}
.dish h3{font:600 16px/1.3 var(--f-ui);margin:0;min-width:0}
.dish .p{font:700 15px var(--f-num);font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.dish .d{grid-column:1/-1;color:var(--muted);font-size:14px;margin:0;max-width:60ch}
.tags{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.badge{font:700 9.5px var(--f-ui);letter-spacing:.08em;text-transform:uppercase;color:var(--gold);border:1px solid currentColor;border-radius:999px;padding:2px 7px}
.off{opacity:.45}
.off h3::after{content:" · " attr(data-off);font-weight:500;color:var(--muted)}
.snote{color:var(--muted);font-size:13.5px;margin:0 0 4px}
.nalg{margin-top:16px;padding:12px 14px;border:1px dashed var(--line);border-radius:14px;color:var(--muted);font-size:13.5px}
.dish .p small{font:500 11.5px var(--f-ui);color:var(--muted);margin-right:5px}
.code.nodata{background:transparent;border:1px dashed var(--line);color:var(--muted);font-weight:600}
.fnote{color:var(--muted);font-size:13px;margin:0;padding:0 14px 14px}
.empty{color:var(--muted);font-size:14px;padding:10px 0}
footer{margin-top:34px;padding-top:16px;border-top:1px solid var(--line);color:var(--muted);font-size:12.5px;display:grid;gap:6px}
.legal{display:grid;gap:6px;padding:12px 14px;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
.legal b{color:var(--ink);font-weight:600}
footer .by{display:flex;align-items:center;gap:8px}
footer .by .disc{width:28px;height:28px;box-shadow:none}
@media (prefers-reduced-motion:no-preference){html{scroll-behavior:smooth}.door .go{transition:transform .15s}}
</style>
</head>

        <span><b>Fuerte Santiago</b><small id="door-fuerte-s"></small></span><span class="go" aria-hidden="true">→</span>
      </a>
      <a class="door mym" href="#mar-y-monte" id="door-mym">
        <span class="disc"><img src="logos/marymonte.svg" alt=""></span>
        <span><b>Mar y Monte</b><small id="door-mym-s"></small></span><span class="go" aria-hidden="true">→</span>

  <div id="carta" hidden>
    <div class="bar">
      <button class="back" id="back"></button>
      <div class="lang" role="group" aria-label="Idioma"><button data-l="es" id="cl-es">ES</button><button data-l="en" id="cl-en">EN</button></div>
    </div>
    <div class="head">
      <div class="disc"><img id="c-logo" src="" alt=""></div>
      <div>
        <h1 id="c-name"></h1>
        <div class="meta"><span id="c-addr"></span><span id="c-hours"></span></div>
      </div>
    </div>
    <div class="actions" id="c-actions"></div>
    <span class="phone" id="c-phone"></span>

    <article class="today" id="today"></article>

    <nav aria-label="Secciones"><div class="tabs" id="tabs"></div></nav>
    <p class="nalg" id="nalg" hidden></p>
    <details class="filter" id="filter">
      <summary><b id="f-title"></b><span id="f-count"></span></summary>
      <div class="algs" id="algs"></div>
      <p class="fnote" id="f-note"></p>
    </details>
    <main id="menu"></main>
    <footer>
      <div class="legal"><b id="f-alg"></b><span id="f-cross"></span><span id="f-anis"></span><span id="f-iva"></span></div>
      <span class="by"><span class="disc"><img src="logos/grupo.svg" alt=""></span><span>Grupo Berrenchina</span></span>
    </footer>
  </div>
</div>

let lang="es"; const hide=new Set();
try{const s=localStorage.getItem("gb-lang"); if(s==="en"||s==="es") lang=s;}catch(e){}
const $=id=>document.getElementById(id);
const algBy=Object.fromEntries(ALG.map(a=>[a[1],a]));
const money=p=>p==null?T[lang].sm:p.toLocaleString(lang==="es"?"es-ES":"en-GB",{style:"currency",currency:"EUR"});
const price=d=>d.p==null?(d.pt==="ask"?T[lang].ask:T[lang].sm):money(d.p)+(d.u?T[lang].u[d.u]:"");
function priceEl(d){const sp=el("span","p"); if(d.p2==null){sp.textContent=price(d); return sp;}
  const lb=T[lang].pl[d.pl]; [[lb[0],d.p],[lb[1],d.p2]].forEach(([l,v],i)=>{if(i) sp.append(el("br")); sp.append(el("small",null,l),document.createTextNode(money(v)));}); return sp;}
function el(tag,cls,txt){const e=document.createElement(tag); if(cls) e.className=cls; if(txt!=null) e.textContent=txt; return e;}
let HOY={};
function madridDow(){return ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"].indexOf(new Intl.DateTimeFormat("en-US",{timeZone:"Europe/Madrid",weekday:"short"}).format(new Date()));}
function madridDate(){return new Intl.DateTimeFormat("en-CA",{timeZone:"Europe/Madrid",year:"numeric",month:"2-digit",day:"2-digit"}).format(new Date());}
function today(){return new Date().toLocaleDateString(lang==="es"?"es-ES":"en-GB",{weekday:"long",day:"numeric",month:"long"});}

function route(){
  const key=location.hash.replace("#","");
  const r=document.documentElement;
  document.documentElement.lang=lang;
  const dm=(DATA[key]&&DATA[key].demo)?DATA[key].demo[lang]:T[lang].demo; $("demo").textContent=dm; $("demo").hidden=!dm;
  document.querySelectorAll(".lang button").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.l===lang)));
  if(DATA[key]){ r.dataset.local=DATA[key].theme; $("home").hidden=true; $("carta").hidden=false; renderCarta(key); }
  else { delete r.dataset.local; $("carta").hidden=true; $("home").hidden=false;
    $("h-sub").textContent=T[lang].sub; $("door-fuerte-s").textContent=T[lang].dfs; $("door-mym-s").textContent=T[lang].dmym; }
}
function renderCarta(key){
  const L=DATA[key], t=T[lang];
  $("back").textContent=t.back;
  $("c-logo").src=L.logo; $("c-logo").alt=L.name; $("c-name").textContent=L.name;
  $("c-addr").textContent=L.address; $("c-hours").textContent=L.hours[lang];
  const act=$("c-actions"); act.replaceChildren();
  const links=[]; if(L.phone) links.push([t.call,"tel:+34"+L.phone.replace(/\s/g,""),1]);
  links.push([t.map,L.maps]); if(L.instagram) links.push([t.ig,L.instagram]);
  links.forEach(([lab,href,pri])=>{const a=el("a","btn"+(pri?" primary":""),lab); a.href=href; if(pri) a.setAttribute("aria-label",lab+" · "+L.phone); if(href.startsWith("http")){a.target="_blank";a.rel="noopener";} act.append(a);});
  $("c-phone").hidden=true;
  // Hoy
  const td=$("today"); td.replaceChildren();
  const words=L.today.kind==="menu"?t.menu:t.plato;
  td.append(el("div","kicker",today()));
  const h=el("h2"); h.append(document.createTextNode(words[0]+" "), el("span",null,words[1])); td.append(h);
  // Menú o plato de hoy: sale de hoy.json por fecha (hora de Madrid). Sin entrada para hoy, no se inventa nada.
  const H=(HOY[key]||{})[madridDate()], txt=v=>Array.isArray(v)?(lang==="en"&&v[1]?v[1]:v[0]):v;
  const keys=Object.keys(L.today.labels);
  if(H&&H.cerrado){ td.append(el("div","grp",t.tclosed+" "+(words[0]+" "+words[1]).toLowerCase()+".")); }
  else if(H){ keys.forEach(k=>{const items=[].concat(H[k]||[]); if(!items.length) return; const d=el("div","grp");
      if(keys.length>1) d.append(el("b",null,L.today.labels[k][lang])); items.forEach(i=>d.append(el("div",null,txt(i)))); td.append(d);}); }
  else if(L.today.days&&!L.today.days.includes(madridDow())) td.append(el("div","grp",t.tweekdays));
  else { if(L.today.generic) td.append(el("div","grp",L.today.generic[lang])); td.append(el("div","grp",t.tnone[L.today.kind])); }
  const off=!H&&L.today.days&&!L.today.days.includes(madridDow());
  if(!(H&&H.cerrado)&&!off){ const pr=el("div","price"); const inc=H&&H.incluye?txt(H.incluye):(L.today.incl?L.today.incl[lang]:"");
    pr.append(el("strong",null,money(H&&H.precio!=null?H.precio:L.today.price))); if(inc) pr.append(el("span",null,inc)); td.append(pr); }
  // Filtro: solo si la carta tiene alérgenos cargados
  const hasA=L.allergens!==false; $("filter").hidden=!hasA; $("nalg").hidden=hasA; $("nalg").textContent=t.nalg;
  $("f-title").textContent=t.ftitle; $("f-note").textContent=t.fnote; $("f-count").textContent=hide.size?t.fsome(hide.size):t.fnone;
  const algs=$("algs"); algs.replaceChildren();
  ALG.forEach(([c,k,es,en])=>{const b=el("button","alg"); b.id="alg-"+k; b.setAttribute("aria-pressed",String(hide.has(k)));
    b.append(el("span","code",c),document.createTextNode(lang==="es"?es:en)); b.onclick=()=>{hide.has(k)?hide.delete(k):hide.add(k); renderCarta(key);}; algs.append(b);});
  // Secciones
  const tabs=$("tabs"); tabs.replaceChildren(); const menu=$("menu"); menu.replaceChildren();
  L.sections.forEach((s,i)=>{
    const b=el("button","tab"+(i===0?" on":""),s[lang]); b.dataset.target=s.id; b.onclick=()=>document.getElementById(s.id).scrollIntoView(); tabs.append(b);
    const sec=el("section"); sec.id=s.id; sec.append(el("h2",null,s[lang])); if(s.note) sec.append(el("p","snote",s.note[lang]));
    const list=L.dishes.filter(d=>d.s===s.id&&(hide.size&&hasA?d.a!=null&&!d.a.some(a=>hide.has(a)):true));
    if(!list.length) sec.append(el("p","empty",t.empty));
    list.forEach(d=>{const row=el("article","dish"+(d.off?" off":"")); const h3=el("h3",null,d[lang]); if(d.off) h3.dataset.off=t.off;
      row.append(h3,priceEl(d)); if(d.d) row.append(el("p","d",d.d[lang]));
      const nd=hasA&&d.a==null; if((d.a&&d.a.length)||d.star||nd){const tg=el("div","tags"); if(d.star) tg.append(el("span","badge",t.star)); (d.a||[]).forEach(k=>{const a=algBy[k]; tg.append(el("span","code",lang==="es"?a[2]:a[3]));}); if(nd) tg.append(el("span","code nodata",t.nodata)); row.append(tg);}
      sec.append(row);});
    menu.append(sec);
  });
  $("f-alg").textContent=t.falg; $("f-cross").textContent=L.cross?t.cross:""; $("f-cross").hidden=!L.cross; $("f-anis").textContent=L.anisakis?t.anis:""; $("f-anis").hidden=!L.anisakis; $("f-iva").textContent=t.fiva;
  observe();
}
let io;
function observe(){ if(io) io.disconnect(); if(!("IntersectionObserver" in window)) return;
  io=new IntersectionObserver(es=>es.forEach(e=>{ if(e.isIntersecting) document.querySelectorAll(".tab").forEach(b=>b.classList.toggle("on",b.dataset.target===e.target.id)); }),{rootMargin:"-80px 0px -70% 0px"});
  document.querySelectorAll("main section").forEach(s=>io.observe(s)); }
$("back").onclick=()=>{ location.hash="inicio"; window.scrollTo(0,0); };
document.querySelectorAll(".lang button").forEach(b=>b.onclick=()=>{lang=b.dataset.l; try{localStorage.setItem("gb-lang",lang)}catch(e){} route();});
window.addEventListener("hashchange",()=>{route(); window.scrollTo(0,0);});
route();
fetch("hoy.json",{cache:"no-store"}).then(r=>r.ok?r.json():{}).then(j=>{HOY=j||{}; route();}).catch(()=>{});
