<style>
@font-face{font-family:"Montserrat";font-style:normal;font-weight:300;font-display:swap;src:url(fonts/montserrat-latin-300-normal.woff2) format("woff2")}
@font-face{font-family:"Montserrat";font-style:normal;font-weight:400;font-display:swap;src:url(fonts/montserrat-latin-400-normal.woff2) format("woff2")}
@font-face{font-family:"Montserrat";font-style:normal;font-weight:500;font-display:swap;src:url(fonts/montserrat-latin-500-normal.woff2) format("woff2")}
@font-face{font-family:"Montserrat";font-style:normal;font-weight:600;font-display:swap;src:url(fonts/montserrat-latin-600-normal.woff2) format("woff2")}
@font-face{font-family:"Montserrat";font-style:normal;font-weight:700;font-display:swap;src:url(fonts/montserrat-latin-700-normal.woff2) format("woff2")}
@font-face{font-family:"Montserrat";font-style:normal;font-weight:800;font-display:swap;src:url(fonts/montserrat-latin-800-normal.woff2) format("woff2")}
@font-face{font-family:"Montserrat";font-style:italic;font-weight:800;font-display:swap;src:url(fonts/montserrat-latin-800-italic.woff2) format("woff2")}
@font-face{font-family:"Ms Madi";font-style:normal;font-weight:400;font-display:swap;src:url(fonts/ms-madi-latin-400-normal.woff2) format("woff2")}
@font-face{font-family:"Kaushan Script";font-style:normal;font-weight:400;font-display:swap;src:url(fonts/kaushan-script-latin-400-normal.woff2) format("woff2")}
/* Layout: portada con dos puertas (una por restaurante) y carta de una columna para el móvil en mesa.
   Cada restaurante redefine los tokens: granate y piedra (Fuerte Santiago), verde de mar y bruma (Mar y Monte). */
:root{
  --bg:#f4f1ec; --surface:#fffdf9; --ink:#1d1d1b; --muted:#6a625c; --line:#e2dbd2;
  --accent:#6e1a17; --accent-ink:#fffdf9; --soft:#efe6dc; --gold:#a8782f;
  --logo-red:#e20613; --logo-yellow:#f8b133;
  --f-ui:"Montserrat", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-script:"Kaushan Script", "Brush Script MT", cursive;
  --f-num:"Montserrat", system-ui, sans-serif;
}
:root[data-local="fuerte"]{ --bg:#f5f1ee; --surface:#fffdfb; --line:#e6dad4; --accent:#6e1a17; --soft:#f1e3dd; --gold:#a8782f; --muted:#6f5b58 }
:root[data-local="mym"]{ --bg:#eef3f1; --surface:#fbfdfc; --line:#d3e0dc; --accent:#125a5c; --soft:#dceae6; --gold:#5f7a2e; --muted:#566a66 }
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --bg:#141211; --surface:#1d1a18; --ink:#f1ece6; --muted:#a99f97; --line:#34302c; --accent:#e6a25a; --accent-ink:#141211; --soft:#2a2420; --gold:#e0b46a; color-scheme:dark }
  :root:not([data-theme="light"])[data-local="fuerte"]{ --bg:#170d0c; --surface:#211413; --line:#3a2725; --accent:#e58a83; --soft:#2d1b19; --gold:#d9b27a; --muted:#b7a19c }
  :root:not([data-theme="light"])[data-local="mym"]{ --bg:#0c1615; --surface:#13201f; --line:#253634; --accent:#6fc3bd; --soft:#1a2c2a; --gold:#b5cc7a; --muted:#9db3ae }
}
:root[data-theme="dark"]{ --bg:#141211; --surface:#1d1a18; --ink:#f1ece6; --muted:#a99f97; --line:#34302c; --accent:#e6a25a; --accent-ink:#141211; --soft:#2a2420; --gold:#e0b46a; color-scheme:dark }
:root[data-theme="dark"][data-local="fuerte"]{ --bg:#170d0c; --surface:#211413; --line:#3a2725; --accent:#e58a83; --soft:#2d1b19; --gold:#d9b27a; --muted:#b7a19c }
:root[data-theme="dark"][data-local="mym"]{ --bg:#0c1615; --surface:#13201f; --line:#253634; --accent:#6fc3bd; --soft:#1a2c2a; --gold:#b5cc7a; --muted:#9db3ae }

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:400 16px/1.5 var(--f-ui);transition:background .25s}
.demo{background:var(--logo-yellow);color:#1d1d1b;font:600 12.5px/1.4 var(--f-ui);padding:7px 16px;text-align:center}
.wrap{max-width:640px;margin:0 auto;padding-inline:16px;padding-block:0 56px}
.disc{background:#fff;border-radius:50%;display:grid;place-items:center;box-shadow:0 1px 0 var(--line),0 8px 24px rgba(0,0,0,.08);flex:none}
.disc img{display:block;width:88%;height:auto}
button{font:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}

/* Portada */
[hidden]{display:none!important}
#home{padding-block:36px 24px;display:grid;gap:28px;justify-items:center;text-align:center}
#home .disc{width:132px;height:132px}
#home h1{margin:0;font:800 italic clamp(26px,7vw,34px)/1.1 var(--f-ui);text-wrap:balance}
#home h1 span{display:block;font:400 .62em var(--f-script);color:var(--muted);font-style:normal;margin-top:6px}
.doors{display:grid;gap:14px;width:100%}
.door{display:flex;align-items:center;gap:16px;text-align:left;width:100%;padding:16px;border-radius:18px;border:0;cursor:pointer;color:#fff;text-decoration:none}
.door .disc{width:76px;height:76px;box-shadow:none}
.door b{display:block;font:800 italic 22px/1.1 var(--f-ui)}
.door small{display:block;font:500 13px/1.4 var(--f-ui);opacity:.85;margin-top:4px}
.door .go{margin-left:auto;font:600 22px var(--f-ui);opacity:.8}
.door.fuerte{background:#6e1a17}
.door.mym{background:#125a5c}
.door:hover .go{transform:translateX(3px)}
.home-foot{color:var(--muted);font-size:13px}

/* Carta */
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:14px 0}
.back{background:none;border:0;color:var(--muted);font:600 13px var(--f-ui);cursor:pointer;padding:6px 0}
.lang{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.lang button{background:none;border:0;padding:5px 11px;font:600 12px var(--f-ui);color:var(--muted);cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.head{display:flex;gap:16px;align-items:center;padding-block:18px 14px}
.head .disc{width:92px;height:92px}
.head h1{margin:0;font:800 italic clamp(24px,6.5vw,30px)/1.1 var(--f-ui);text-wrap:balance}
.head .meta{color:var(--muted);font-size:13.5px;margin-top:6px;display:grid}
.actions{display:flex;flex-wrap:wrap;gap:8px}
.btn{display:inline-flex;align-items:center;padding:9px 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:600 13.5px var(--f-ui);text-decoration:none;cursor:pointer}
.btn.primary{background:var(--card,var(--accent));border-color:var(--card,var(--accent));color:#fff}
.phone{font:500 12.5px var(--f-num);color:var(--muted);user-select:all;margin-top:6px;display:block}

/* Tarjeta de hoy con la tipografía del cartel del menú: MENÚ en Montserrat negra mayúscula, "del día" y los grupos en script dorado/blanco, platos en mayúscula fina */
/* Color fijo de la tarjeta de hoy: no cambia con el modo oscuro del móvil */
:root[data-local="fuerte"]{--card:#6e1a17}
:root[data-local="mym"]{--card:#125a5c}
.today{--gold:#d2ad72;--cream:#f6efe6;margin-top:20px;background:var(--card,#6e1a17);color:var(--cream);border-radius:20px;padding:22px 22px 20px;position:relative;overflow:hidden}
.today .thead{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:14px;padding-bottom:12px;border-bottom:1.5px solid var(--gold)}
.today h2{margin:0;font:800 38px/.95 var(--f-ui);text-transform:uppercase;letter-spacing:-.01em;color:var(--cream)}
.today h2 span{display:block;font:400 34px/1 var(--f-script);text-transform:none;color:var(--gold);margin-top:2px;letter-spacing:0}
.today .grp{display:grid;gap:1px;margin-bottom:12px}
.today .grp b{font:400 28px/1.15 var(--f-script);color:var(--gold);margin-bottom:2px}
.today .tdate{display:grid;justify-items:end;text-align:right;text-transform:uppercase;line-height:1}
.today .tdate .wd{font:700 13px var(--f-ui);letter-spacing:.2em;color:var(--gold);margin-right:-.2em}
.today .tdate .dd{font:800 50px/.95 var(--f-ui);color:var(--cream);font-variant-numeric:tabular-nums}
.today .tdate .mm{font:700 11.5px var(--f-ui);letter-spacing:.24em;color:var(--cream);margin-right:-.24em;margin-top:3px}
.today .grp div{font:400 14.5px/1.3 var(--f-ui);text-transform:uppercase;letter-spacing:.02em;text-wrap:balance}
.today .grp div+div{margin-top:3px}
.today .grp b~div{position:relative;padding-left:.85em}
.today .grp b~div::before{content:"·";position:absolute;left:.1em;top:0}
.today .price{display:flex;align-items:center;justify-content:space-between;gap:8px 0;flex-wrap:wrap;border-top:1.5px solid var(--gold);padding-top:14px;margin-top:6px}
.today .price strong{order:2;flex:none;margin-left:auto;padding:2px 4px 2px 16px;border-left:1px solid color-mix(in srgb,var(--gold) 55%,transparent);font:400 clamp(28px,8.6vw,33px)/1 var(--f-script);color:var(--gold)}
.today .price .incl{order:1;flex:0 1 auto;margin-right:16px;font:700 clamp(10.5px,3vw,12.5px)/1.35 var(--f-ui)}
.today .price .incl .l{display:block;white-space:nowrap}
@media (max-width:340px){.today .price strong{border-left:0;padding-left:0}}
.today .price.solo strong{border-left:0;padding-left:0}
.today .price.inline{border-top:0;padding-top:2px;margin-top:0;flex-wrap:nowrap}
.today .price.inline .pdish{order:1;flex:1 1 auto;min-width:0;margin-right:16px;font:400 15px/1.3 var(--f-ui);text-transform:uppercase;letter-spacing:.02em;text-wrap:balance}
.today .price.inline .pdish .l{display:block}
.today .price.inline .pdish .l+.l{margin-top:6px}
.today .price.inline .pdish .sub{font-size:12.5px;text-transform:none;letter-spacing:0;opacity:.85}
.today .price.inline strong{align-self:center}
/* Mar y Monte: línea de su cartelería (Montserrat negra en mayúscula + firma caligráfica Ms Madi en ámbar). No afecta a Fuerte Santiago. */
:root[data-local="mym"]{--f-sign:"Ms Madi","Kaushan Script",cursive}
:root[data-local="mym"] main h2{font:400 46px/1 var(--f-sign);margin:0 0 4px}
:root[data-local="mym"] .today{--gold:#f6a823}
:root[data-local="mym"] .today .eyebrow{font:300 11px var(--f-ui);letter-spacing:.06em;text-transform:uppercase;margin-bottom:10px}
:root[data-local="mym"] .today .eyebrow b{font-weight:800;color:var(--gold)}
:root[data-local="mym"] .today h2{font-size:34px}
:root[data-local="mym"] .today h2 span{font:400 52px/.8 var(--f-sign);margin:2px 0 0 4px}
:root[data-local="mym"] .today .tdate .wd{font-weight:800}
:root[data-local="mym"] .today .price.inline .pdish{font:800 19px/1.15 var(--f-ui);letter-spacing:0}
:root[data-local="mym"] .today .price.inline .pdish .l+.l{font:400 13px/1.35 var(--f-ui);text-transform:none;margin-top:6px}
:root[data-local="mym"] .today .price.inline strong{font:600 30px/1 var(--f-ui);color:var(--gold)}
:root[data-local="mym"] .today .nday b{font:500 13px/1.2 var(--f-ui);text-transform:uppercase;letter-spacing:.14em;margin-bottom:4px}
:root[data-local="mym"] .today .ni{font-weight:700}
.today .next{margin-top:14px;border-top:1.5px solid var(--gold);padding-top:10px}
.today .next summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;font:700 12px var(--f-ui);letter-spacing:.18em;text-transform:uppercase;color:var(--gold);padding:4px 0}
.today .next summary::-webkit-details-marker{display:none}
.today .next summary::after{content:"";width:8px;height:8px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:rotate(45deg) translateY(-3px);transition:transform .2s}
.today .next[open] summary::after{transform:rotate(-135deg) translateY(-1px)}
.today .nday{padding:10px 0 2px}
.today .nday+.nday{border-top:1px solid color-mix(in srgb,var(--gold) 30%,transparent)}
.today .nday b{display:block;font:400 22px/1.15 var(--f-script);color:var(--gold);margin-bottom:2px}
.today .nday b::first-letter{text-transform:uppercase}
.today .ni{font:400 13.5px/1.35 var(--f-ui);text-transform:uppercase;letter-spacing:.02em}

/* Menú especial (Navidad): solo locales con L.special. Misma familia que la tarjeta de hoy, en granate profundo con doble filete dorado */
.xmas{--gold:#d2ad72;--cream:#f6efe6;margin-top:14px;position:relative;overflow:hidden;border-radius:20px;padding:26px 22px 20px;color:var(--cream);text-align:center;background:radial-gradient(130% 70% at 50% 0%,#86221e 0%,#6e1a17 45%,#3f0c0b 100%);scroll-margin-top:70px}
.xmas::before{content:"";position:absolute;inset:8px;border:1px solid color-mix(in srgb,var(--gold) 60%,transparent);border-radius:14px;pointer-events:none}
.xmas::after{content:"";position:absolute;inset:12px;border:1px solid color-mix(in srgb,var(--gold) 22%,transparent);border-radius:11px;pointer-events:none}
.xmas .sp{position:absolute;width:var(--s);height:var(--s);opacity:var(--o,.85)}
.xmas .sp::before,.xmas .sp::after{content:"";position:absolute;left:50%;top:0;width:1.5px;height:100%;margin-left:-.75px;background:linear-gradient(transparent,var(--gold),transparent)}
.xmas .sp::after{transform:rotate(90deg)}
.xmas .kick{font:700 10.5px var(--f-ui);letter-spacing:.28em;text-transform:uppercase;color:var(--gold);padding-left:.28em}
.xmas h2{margin:8px 0 0;font:800 40px/.9 var(--f-ui);text-transform:uppercase;letter-spacing:-.01em;color:var(--cream)}
.xmas h2 span{display:block;font:400 38px/1 var(--f-script);text-transform:none;color:var(--gold);letter-spacing:0;margin-top:2px}
.xmas .yr{display:flex;align-items:center;justify-content:center;gap:12px;margin-top:6px;font:600 12px var(--f-ui);letter-spacing:.5em;padding-left:.5em;color:var(--gold)}
.xmas .yr::before,.xmas .yr::after{content:"";width:34px;height:1px;background:var(--gold);opacity:.7}
.xmas .xs{margin-top:16px}
.xmas .xs b{display:block;font:400 25px/1.1 var(--f-script);color:var(--gold);margin-bottom:4px}
.xmas .xs div{font:400 14px/1.35 var(--f-ui);text-transform:uppercase;letter-spacing:.02em;text-wrap:balance}
.xmas .xs div+div{margin-top:3px}
.xmas .xs .or{display:flex;align-items:center;justify-content:center;gap:10px;font:400 20px/1 var(--f-script);color:var(--gold);text-transform:none;margin:4px 0}
.xmas .xs .or::before,.xmas .xs .or::after{content:"";width:26px;height:1px;background:var(--gold);opacity:.6}
.xmas .xs .fine{font:500 11.5px/1.4 var(--f-ui);text-transform:none;letter-spacing:.01em;opacity:.8;margin-top:6px}
.xmas .xp{display:flex;align-items:center;justify-content:center;gap:16px;margin-top:18px;padding-top:14px;border-top:1.5px solid var(--gold);text-align:left}
.xmas .xp strong{font:400 44px/1 var(--f-script);color:var(--gold);padding-right:16px;border-right:1px solid color-mix(in srgb,var(--gold) 55%,transparent)}
.xmas .xp span{font:700 11.5px/1.4 var(--f-ui);letter-spacing:.14em;text-transform:uppercase}
.xmas .xp span i{display:block;font-style:normal}
.xmas .xcta{display:block;margin:16px auto 2px;max-width:260px;padding:12px 18px;border-radius:999px;background:var(--gold);color:#3f0c0b;font:800 13px var(--f-ui);letter-spacing:.14em;text-transform:uppercase;text-decoration:none;position:relative;z-index:1}
.xmas .xnote{margin-top:10px;font:500 11px/1.4 var(--f-ui);opacity:.7}

nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line);margin-inline:-16px;padding:10px 16px;margin-top:22px}
.tabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;padding:7px 13px;border-radius:999px;border:0;background:transparent;color:var(--muted);font:600 13.5px var(--f-ui);cursor:pointer;white-space:nowrap}
.tab.on{background:var(--soft);color:var(--ink)}
.tab.xtab{color:var(--accent);font-weight:700}
.filter{margin-top:16px;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
.filter summary{padding:12px 14px;cursor:pointer;font-weight:600;font-size:14px;display:flex;justify-content:space-between;gap:8px}
.filter summary span{color:var(--muted);font-weight:400;font-size:13px}
.algs{display:flex;flex-wrap:wrap;gap:6px;padding:0 14px 14px}
.alg{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:999px;padding:4px 10px 4px 5px;font:500 13px var(--f-ui);cursor:pointer}
.alg[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.code{display:inline-grid;place-items:center;min-width:22px;height:22px;border-radius:999px;background:var(--soft);color:var(--ink);font:700 9.5px var(--f-ui);padding:0 5px}
.alg[aria-pressed="true"] .code{background:var(--bg)}
main section{padding-top:26px;scroll-margin-top:70px}
main h2{font:400 30px/1.1 var(--f-script);color:var(--accent);margin:0 0 2px}
.dish{display:grid;grid-template-columns:1fr auto;gap:3px 16px;padding:13px 0;border-bottom:1px solid var(--line)}
.dish:last-child{border-bottom:0}
.dish h3{font:600 16px/1.3 var(--f-ui);margin:0;min-width:0}
.dish .p{font:700 15px var(--f-num);font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.dish .d{grid-column:1/-1;color:var(--muted);font-size:14px;margin:0;max-width:60ch}
.tags{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.badge{font:700 9.5px var(--f-ui);letter-spacing:.08em;text-transform:uppercase;color:var(--gold);border:1px solid currentColor;border-radius:999px;padding:2px 7px}
.off{opacity:.45}
.off h3::after{content:" · " attr(data-off);font-weight:500;color:var(--muted)}
.snote{color:var(--muted);font-size:13.5px;margin:0 0 4px}
main h4.sub{margin:18px 0 0;font:700 11.5px var(--f-ui);letter-spacing:.16em;text-transform:uppercase;color:var(--accent)}
main h4.sub+.dish{padding-top:8px}
/* Fuerte: títulos de la carta en dorado (en claro, un dorado algo más oscuro en los subtítulos pequeños para que se lean) */
:root[data-local="fuerte"] main h2,:root[data-local="fuerte"] .tab.xtab{color:var(--gold)}
:root[data-local="fuerte"] main h4.sub{color:#8a6326}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"])[data-local="fuerte"] main h2,:root:not([data-theme="light"])[data-local="fuerte"] main h4.sub,:root:not([data-theme="light"])[data-local="fuerte"] .tab.xtab{color:var(--gold)}}
:root[data-theme="dark"][data-local="fuerte"] main h2,:root[data-theme="dark"][data-local="fuerte"] main h4.sub,:root[data-theme="dark"][data-local="fuerte"] .tab.xtab{color:var(--gold)}
.nalg{margin-top:16px;padding:12px 14px;border:1px dashed var(--line);border-radius:14px;color:var(--muted);font-size:13.5px}
.dish .p small{font:500 11.5px var(--f-ui);color:var(--muted);margin-right:5px}
.code.nodata{background:transparent;border:1px dashed var(--line);color:var(--muted);font-weight:600}
.fnote{color:var(--muted);font-size:13px;margin:0;padding:0 14px 14px}
.empty{color:var(--muted);font-size:14px;padding:10px 0}
footer{margin-top:34px;padding-top:16px;border-top:1px solid var(--line);color:var(--muted);font-size:12.5px;display:grid;gap:6px}
.legal{display:grid;gap:6px;padding:12px 14px;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
.legal b{color:var(--ink);font-weight:600}
footer .by{display:flex;align-items:center;gap:8px}
footer .by .disc{width:28px;height:28px;box-shadow:none}

.ev .chip{background:transparent;border-color:color-mix(in srgb,var(--gold) 55%,transparent);color:var(--cream)}
.ev .go{position:relative;display:flex;justify-content:center;width:100%;padding:13px;border-radius:999px;background:var(--gold);color:#3f0c0b;font:800 13.5px var(--f-ui);letter-spacing:.14em;text-transform:uppercase;border:0;cursor:pointer}
.chips{display:flex;gap:7px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:8px 11px;font:600 13.5px/1.15 var(--f-ui);color:var(--ink);text-align:center;cursor:pointer;display:inline-flex;flex-direction:column;align-items:center}
.chip small{display:block;font:500 11px var(--f-ui);color:var(--muted);margin-top:2px}

.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;background:var(--surface);color:var(--ink);border-radius:22px 22px 0 0;padding:10px 20px 22px;max-width:640px;max-height:92vh;overflow-y:auto;margin:0 auto;box-shadow:0 -10px 40px rgba(0,0,0,.2);text-align:left}
.sheet .grab{width:40px;height:4px;border-radius:4px;background:var(--line);margin:0 auto 12px}

.sheet .sh b{display:block;font:400 30px/1.05 var(--f-script);color:#6e1a17;margin-top:4px}

.fld{margin-top:14px}
.fld label,.fld .l{display:block;font:700 12px var(--f-ui);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:7px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.inp{width:100%;border:1px solid var(--line);border-radius:12px;background:var(--bg);padding:11px 12px;font:500 16px var(--f-ui);color:var(--ink);min-height:47px}
textarea.inp{resize:vertical;min-height:70px}
.inp:invalid.touched,.chips.bad{outline:2px solid #c0392b;outline-offset:2px}
.send{margin-top:18px;display:flex;align-items:center;justify-content:center;gap:9px;width:100%;padding:14px;border-radius:999px;background:#6e1a17;color:#fff;font:700 15.5px var(--f-ui);border:0;cursor:pointer}
.send svg{width:19px;height:19px}
.fine{margin:9px 0 0;text-align:center;font-size:12.5px;color:var(--muted)}
.err{margin:10px 0 0;text-align:center;font:600 13px var(--f-ui);color:#c0392b}

   Negro y verde del cartel del ciclo. Cada uno desaparece solo al día siguiente del concierto (CONCIERTOS, hora de Madrid). */
